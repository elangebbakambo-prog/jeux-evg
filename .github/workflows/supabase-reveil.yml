# Garde la base Supabase de l'appli « Vegas EVG » éveillée.
# Sur le plan gratuit, Supabase met en pause un projet sans activité pendant 7 jours :
# ici, GitHub fait une petite lecture tous les 3 jours pour que les souvenirs restent en ligne.
# La clé utilisée est la clé « publishable » (publique, déjà dans config.js), jamais la clé secrète.
name: Réveil Supabase

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Petite lecture dans la base
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://mrxfwkmdcqicirccgiom.supabase.co/rest/v1/vegas_suivi?select=nom&limit=1" \
            -H "apikey: sb_publishable_SMy5j__0GTgrJHhJ4GmYQg_2OQ8fTLh")
          echo "Réponse de Supabase : $code"
          test "$code" = "200"
