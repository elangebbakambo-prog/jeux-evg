<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0C0C0D">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vegas EVG">
<title>Vegas EVG Sobek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
[hidden]{ display:none !important; }
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Carnet de route de l'EVG : un jour à la fois, une ligne de trajets numérotés (l'ordre de la journée), façon enseigne lumineuse du Strip.
   Thème « noir mat » : noir profond, filets fins, le rouge (couleur préférée du marié) seulement sur l'essentiel. */
:root{
  --night:#0C0C0D; --card:#141416; --card2:#1B1B1E; --line:#2A2A2D;
  --sand:#F2F2F2; --muted:#8E8E93; --amber:#D4D4D8; --pink:#F0343E; --red:#E5252F; --mint:#4CC9A0;
  --display:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{ box-sizing:border-box; }
html{ background:var(--night); }
body{ background:var(--night); color:var(--sand); font-family:var(--body); font-size:16px; line-height:1.45;
  background-image:radial-gradient(ellipse 80% 40% at 50% 0%, rgba(255,59,74,.22), transparent 70%), radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 0);
  background-size:100% 100%, 20px 20px; }
main{ max-width:640px; margin:0 auto; padding-block:22px 60px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  display:flex; flex-direction:column; gap:16px; }
.eyebrow{ margin:0; font-weight:600; font-size:.78rem; letter-spacing:.16em; text-transform:uppercase; color:var(--amber); }
h1{ margin:0; font-family:var(--display); font-weight:400; font-size:clamp(2.6rem,12vw,4rem); line-height:.95; color:var(--sand);
  text-shadow:0 0 18px rgba(255,59,74,.55), 0 0 2px rgba(255,59,74,.9); text-wrap:balance; }
h1 span{ color:var(--amber); text-shadow:0 0 18px rgba(255,193,94,.55); }
.lead{ margin:0; color:var(--muted); }
/* Logement */
.home{ background:var(--card); border:2px solid var(--amber); border-radius:16px; padding:14px 16px; display:flex; flex-direction:column; gap:6px; }
.home .k{ font-size:.72rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); }
.home b{ font-size:1.15rem; }
.home .addr{ font-weight:600; user-select:all; }
.actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
.btn{ display:inline-flex; align-items:center; gap:6px; border:2px solid var(--line); background:var(--card2); color:var(--sand); border-radius:999px; padding:7px 13px;
  font:600 .86rem var(--body); text-decoration:none; cursor:pointer; }
.btn.hot{ border-color:var(--red); background:var(--red); color:#fff; }
.btn:focus-visible, .day:focus-visible, .tab:focus-visible{ outline:3px solid var(--amber); outline-offset:2px; }
/* Barre du haut + menu qui glisse */
.top{ position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:10px; padding:8px max(12px, env(safe-area-inset-right,0px)) 8px max(12px, env(safe-area-inset-left,0px));
  padding-top:max(8px, env(safe-area-inset-top,0px)); background:rgba(12,12,13,.88); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
:root{ padding-top:0; }
.top b{ flex:1; font-family:var(--display); font-weight:400; font-size:1.05rem; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ico{ all:unset; cursor:pointer; width:44px; height:44px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; border-radius:12px; flex:0 0 auto; }
.ico span{ display:block; width:22px; height:2px; border-radius:2px; background:var(--sand); }
.ico:focus-visible, .lost:focus-visible, .nav a:focus-visible, .nav button:focus-visible{ outline:3px solid var(--amber); outline-offset:2px; }
.ico.x{ font-size:1.3rem; }
.lost{ all:unset; cursor:pointer; font:600 .82rem var(--body); color:#fff; background:var(--red); border-radius:999px; padding:9px 13px; flex:0 0 auto; }
.scrim{ position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .25s; }
.drawer{ position:fixed; top:0; bottom:0; left:0; z-index:100; width:min(82vw, 320px); background:var(--card); border-right:1px solid var(--line);
  transform:translateX(-102%); transition:transform .28s cubic-bezier(.2,.8,.2,1); overflow-y:auto; overscroll-behavior:contain;
  padding:max(14px, env(safe-area-inset-top,0px)) 14px max(20px, env(safe-area-inset-bottom,0px)) max(14px, env(safe-area-inset-left,0px)); display:flex; flex-direction:column; gap:14px; }
body.menu .drawer{ transform:none; box-shadow:8px 0 30px rgba(0,0,0,.5); } body.menu .scrim{ opacity:1; pointer-events:auto; }
.dr-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.dr-title{ display:block; font-family:var(--display); font-weight:400; font-size:1.6rem; line-height:1; margin-top:4px; text-shadow:0 0 14px rgba(255,59,74,.5); }
.dr-title span{ color:var(--amber); font-size:1rem; }
.nav{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
.nav a, .nav button{ all:unset; cursor:pointer; box-sizing:border-box; width:100%; display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; font-weight:500; font-size:1rem; color:var(--sand); }
.nav i{ font-style:normal; width:24px; text-align:center; }
.nav small{ margin-left:auto; color:var(--muted); font-weight:600; font-size:.8rem; }
.nav [aria-current="page"]{ background:var(--red); color:#fff; } .nav [aria-current="page"] small{ color:#ffd9dc; }
.nav-sep{ height:1px; background:var(--line); margin:6px 4px; }
.nav-k{ margin:8px 12px 4px; font-size:.72rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.days{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:6px; padding:0 4px; }
.days .day{ min-width:0; }
.days .day.today:not([aria-pressed="true"]){ border-color:var(--pink); }
/* Accueil « Aujourd'hui » */
.now{ background:var(--card); border:2px solid var(--red); border-radius:18px; padding:14px 16px; display:flex; flex-direction:column; gap:6px; box-shadow:0 0 22px rgba(255,59,74,.25); }
.now .when{ font-size:.76rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--pink); }
.now h3{ margin:0; font-size:1.3rem; font-weight:600; line-height:1.2; }
.now p{ margin:0; font-size:.93rem; color:var(--muted); }
.next{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.next li{ display:flex; gap:10px; align-items:baseline; padding:10px 2px; border-top:1px solid var(--line); }
.next li:first-child{ border-top:0; }
.next small{ flex:0 0 96px; font-size:.75rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--amber); }
.next b{ font-weight:500; font-size:.95rem; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.tile{ all:unset; cursor:pointer; box-sizing:border-box; background:var(--card); border-radius:14px; padding:11px 13px; display:flex; flex-direction:column; gap:2px; min-width:0; }
.tile small{ font-size:.72rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.tile b{ font-size:.98rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tile span{ font-size:.82rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tile:focus-visible{ outline:3px solid var(--amber); outline-offset:2px; }
.bubbles{ display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; padding:2px; }
.bubbles::-webkit-scrollbar{ display:none; }
.bub{ all:unset; cursor:pointer; flex:0 0 auto; width:58px; height:58px; border-radius:50%; padding:2px; border:2px solid var(--line); display:grid; place-items:center; overflow:hidden; background:var(--card2); }
.bub.new{ border-color:var(--pink); box-shadow:0 0 10px rgba(255,59,74,.5); }
.bub img{ width:100%; height:100%; object-fit:cover; border-radius:50%; }
.bub.add{ border-style:dashed; font-size:1.4rem; color:var(--muted); }
/* Noir mat : pas de lueur, pas de dégradé, des filets d'un pixel */
body{ background-image:none !important; -webkit-font-smoothing:antialiased; }
*{ text-shadow:none !important; }
.now, .cta, .bub.new, .dot i, .home, .cta.games{ box-shadow:none !important; }
h1, .dhead h2, .panel h3, .top b, .dr-title, .day b, .stop h3, .now h3, .cta b, .book .tel, .team .score, #montage h3{ font-family:var(--body); font-weight:600 !important; letter-spacing:-.02em; }
.dhead h2{ font-size:1.65rem; line-height:1.15; }
.panel h3{ font-size:1rem; color:var(--sand); }
.top b{ font-size:1rem; }
.dr-title{ font-size:1.35rem; } .dr-title span{ color:var(--muted); font-weight:400; }
.eyebrow, .nav-k, .k, .k2, .when, .stop .when, .next small, .tile small, .day small{ letter-spacing:.06em !important; font-weight:500 !important; }
.eyebrow{ color:var(--muted); }
.panel, .stop, .tile, .home{ border:1px solid var(--line) !important; }
.home{ border-color:var(--line); }
.now{ border:1px solid var(--line); border-left:2px solid var(--red); border-radius:0 16px 16px 0; }
.now .when::before{ content:"● "; }
.next small, .stop .when{ color:var(--muted) !important; }
.btn{ border-width:1px !important; font-weight:500 !important; }
.btn.hot{ font-weight:600; }
.day{ border-width:1px !important; }
.day[aria-pressed="true"]{ background:var(--red); border-color:var(--red); color:#fff; } .day[aria-pressed="true"] small{ color:#ffd6d9; }
.dot i{ border-width:1px !important; width:30px !important; height:30px !important; background:var(--night) !important; font-family:var(--body) !important; font-weight:500; font-size:.85rem !important; }
.dot::after{ width:1px !important; background:var(--line) !important; }
.lost{ background:transparent; color:var(--pink); border:1px solid var(--red); padding:8px 12px; font-weight:500; }
.cta{ border-radius:14px; } .cta.games{ border:1px solid var(--line); } .cta.games b{ color:var(--sand); }
.bub{ border-width:1.5px; } .bub.new{ border-color:var(--red); }
.nav a, .nav button{ font-weight:500; }
.chip{ font-weight:500 !important; }
/* Onglets */
.tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
.tabs::-webkit-scrollbar{ display:none; }
.day{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; min-width:64px; padding:8px 10px; border-radius:12px; border:2px solid var(--line);
  background:var(--card); color:var(--sand); cursor:pointer; font-family:var(--body); }
.day small{ font-size:.7rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.day b{ font-family:var(--display); font-weight:400; font-size:1.5rem; line-height:1; }
.day[aria-pressed="true"]{ border-color:var(--amber); background:var(--amber); color:#1A0B1F; }
.day[aria-pressed="true"] small{ color:#5A3A10; }
.day.extra{ min-width:auto; }
.day.extra b{ font-family:var(--body); font-weight:600; font-size:.95rem; line-height:1.6; }
/* Journée */
.dhead{ display:flex; flex-direction:column; gap:4px; }
.dhead h2{ margin:0; font-family:var(--display); font-weight:400; font-size:clamp(1.6rem,7vw,2.2rem); line-height:1.05; color:var(--sand); text-wrap:balance; }
.dhead p{ margin:0; color:var(--muted); }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ font-size:.74rem; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--card2); color:var(--sand); border:1px solid var(--line); }
.chip.warn{ border-color:var(--pink); color:var(--pink); }
.chip.ok{ border-color:var(--mint); color:var(--mint); }
.tl{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.step{ display:grid; grid-template-columns:40px minmax(0,1fr); gap:0 12px; }
.dot{ display:flex; flex-direction:column; align-items:center; }
.dot i{ font-style:normal; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-family:var(--display); font-size:1rem;
  background:var(--night); border:2px solid var(--pink); color:var(--pink); box-shadow:0 0 10px rgba(255,59,74,.45); flex:0 0 auto; }
.dot::after{ content:""; flex:1; width:2px; background:linear-gradient(var(--pink), var(--line)); margin:2px 0; min-height:14px; }
.step:last-child .dot::after{ display:none; }
.stop{ background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:10px; display:flex; flex-direction:column; gap:5px; min-width:0; }
.stop .when{ font-size:.76rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--amber); }
.stop h3{ margin:0; font-size:1.08rem; font-weight:600; }
.stop .addr{ font-size:.9rem; color:var(--muted); overflow-wrap:anywhere; user-select:all; }
.stop p{ margin:0; font-size:.93rem; }
.go{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:.82rem; color:var(--muted); margin:-2px 0 10px 52px; }
.go b{ color:var(--sand); }
.book{ border:1px solid var(--amber); border-radius:12px; padding:10px 12px; margin-top:4px; display:flex; flex-direction:column; gap:4px; background:rgba(255,193,94,.07); }
.book .k{ font-size:.72rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--amber); }
.book .tel{ font-family:var(--display); font-size:1.15rem; color:var(--sand); user-select:all; }
.book .hrs{ font-size:.85rem; color:var(--mint); font-weight:500; }
.book p{ font-size:.88rem; }
.book .price b, .book p b{ color:var(--sand); }
.when-book{ font-size:.85rem; font-weight:600; border-radius:8px; padding:6px 9px; }
.when-book.today{ background:var(--pink); color:var(--night); }
.when-book.later{ background:rgba(94,224,181,.15); color:var(--mint); }
.what{ margin:2px 0; padding-left:18px; font-size:.88rem; display:flex; flex-direction:column; gap:3px; }
.money{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.money span{ background:var(--card2); border-radius:10px; padding:7px 9px; display:flex; flex-direction:column; gap:2px; min-width:0; }
.money small{ font-size:.72rem; color:var(--muted); }
.money b{ color:var(--sand); font-size:.95rem; }
.order{ margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px; font-size:.93rem; }
.cta{ all:unset; cursor:pointer; display:flex; flex-direction:column; gap:2px; background:var(--red); color:#fff; border-radius:14px; padding:12px 16px; box-shadow:0 0 18px rgba(255,59,74,.4); }
.cta b{ font-family:var(--display); font-weight:400; font-size:1.15rem; }
.cta span{ font-size:.88rem; font-weight:500; }
.cta:focus-visible{ outline:3px solid var(--amber); outline-offset:2px; }
.cta.games{ background:var(--card); color:var(--sand); border:2px solid var(--amber); box-shadow:0 0 14px rgba(255,193,94,.3); text-decoration:none; }
.cta.games b{ color:var(--amber); }
.teampanel{ border:1px solid var(--mint); }
.team{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.team li{ background:var(--card2); border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; gap:5px; min-width:0; }
.team li.mine{ outline:2px solid var(--mint); }
.team .top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.team .top b{ font-size:1.05rem; overflow-wrap:anywhere; }
.team .score{ font-family:var(--display); color:var(--amber); }
.pills{ display:flex; flex-wrap:wrap; gap:6px; }
.pill{ font-size:.8rem; font-weight:600; border-radius:999px; padding:3px 9px; }
.pill.yes{ background:rgba(94,224,181,.18); color:var(--mint); }
.pill.no{ background:rgba(255,59,74,.18); color:var(--pink); }
.miss{ margin:0; font-size:.84rem; color:var(--muted); } .miss.ok{ color:var(--mint); font-weight:500; }
.maj{ margin:0; font-size:.75rem; color:var(--muted); }
.me{ margin:0; font-size:.9rem; }
.who{ display:flex; flex-direction:column; gap:6px; font-size:.9rem; }
.who .row{ display:flex; gap:8px; flex-wrap:wrap; }
.who input{ flex:1 1 160px; min-width:0; font:inherit; font-size:16px; color:var(--sand); background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:9px 12px; }
.who input:focus-visible{ outline:2px solid var(--mint); }
.link{ all:unset; cursor:pointer; color:var(--mint); text-decoration:underline; font-weight:500; }
.perso{ margin:0; font-size:.88rem; }
.part{ margin:0; font-size:.9rem; } .part b{ color:var(--amber); }
.clocks{ display:flex; align-items:center; justify-content:center; gap:12px; }
.clk{ background:var(--card); border-radius:14px; padding:8px 16px; display:flex; flex-direction:column; align-items:center; min-width:0; }
.clk small{ font-size:.72rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.clk b{ font-family:var(--display); font-weight:400; font-size:1.6rem; }
.clk.v b{ color:var(--amber); } .clk.f b{ color:var(--mint); }
.clocks .gap{ font-weight:600; color:var(--pink); font-size:.9rem; }
.compose textarea{ font:inherit; font-size:16px; color:var(--sand); background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; resize:vertical; min-height:60px; width:100%; box-sizing:border-box; }
.compose textarea:focus-visible{ outline:2px solid var(--mint); }
.sides{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:.9rem; color:var(--muted); }
.side{ all:unset; cursor:pointer; border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-weight:600; font-size:.85rem; color:var(--sand); }
.side.on.v{ background:var(--amber); color:var(--night); border-color:var(--amber); }
.side.on.f{ background:var(--mint); color:var(--night); border-color:var(--mint); }
.side:focus-visible{ outline:2px solid var(--pink); }
.preview{ display:flex; flex-direction:column; gap:6px; } .preview img{ border-radius:12px; max-height:260px; object-fit:cover; width:100%; }
.feed{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.daysep{ text-align:center; font-size:.75rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding-top:6px; }
.post{ max-width:86%; background:var(--card); border-radius:16px; padding:10px 12px; display:flex; flex-direction:column; gap:6px; min-width:0; }
.post.v{ align-self:flex-start; border:1px solid var(--amber); border-bottom-left-radius:4px; }
.post.f{ align-self:flex-end; border:1px solid var(--mint); border-bottom-right-radius:4px; }
.post p{ margin:0; overflow-wrap:anywhere; white-space:pre-wrap; }
.post .who2{ display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; font-size:.85rem; } .post .who2 span{ color:var(--muted); }
.post.v .who2 b{ color:var(--amber); } .post.f .who2 b{ color:var(--mint); }
.post .ph{ border-radius:12px; width:100%; min-height:120px; background:var(--card2); object-fit:cover; }
.post .times{ font-size:.75rem; color:var(--muted); } .post .times b{ color:var(--sand); }
.day.extra.live{ border-color:var(--pink); }
.livebar{ display:flex; flex-wrap:wrap; gap:8px; }
.story-btn.new{ box-shadow:0 0 0 3px var(--night), 0 0 0 5px var(--pink); }
.story-btn[disabled]{ opacity:.45; cursor:default; }
.moment-btn{ border-color:var(--amber); color:var(--amber); }
.moment-live{ border:2px solid var(--amber); box-shadow:0 0 22px rgba(255,193,94,.35); }
.moment-live .k, .compose .k, .moment .k{ margin:0; font-family:var(--display); color:var(--amber); font-size:1.15rem; }
.moment-live p{ margin:0; }
.moment-live .count{ font-family:var(--display); font-size:1.5rem; color:var(--pink); }
.btn.big{ font-size:1.05rem; padding:12px 18px; align-self:flex-start; }
.moment{ background:var(--card); border:1px solid var(--amber); border-radius:16px; padding:12px; display:flex; flex-direction:column; gap:8px; }

function readGoto(h){
  h = (h || "").replace(/^.*#/, "");
  let m;
  if((m = /^(?:p|c)=(.+)$/.exec(h))){ goPost = decodeURIComponent(m[1]); goOpen = h[0] === "c"; return "live"; }
  if((m = /^dep=(.+)$/.exec(h))){ goDep = decodeURIComponent(m[1]); return "comptes"; }
  if((m = /^r=(.+)$/.exec(h))){ goResto = decodeURIComponent(m[1]); return "rank"; }
  if(h === "comptes") return "comptes";
  if(h === "live") return "live";
  return "";
}

function pushMe(){
  if(!moi) return;
  clearTimeout(pushTimer);
  const row = { nom:moi, coches:Object.assign({}, checked), maj:new Date().toISOString() };
  const i = team.findIndex(t => t.nom.toLowerCase() === moi.toLowerCase());
  if(i >= 0) team[i] = row; else team.push(row);
  drawTeam();
  pushTimer = setTimeout(async () => {
    try{
      const r = await fetch(SB_URL + "?on_conflict=nom", { method:"POST",
        headers:{ apikey:SB_KEY, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates,return=minimal" },
        body:JSON.stringify(row) });
      if(!r.ok) throw new Error(r.status);
      loadTeam();
    }catch(e){ teamState = "err-save"; drawTeam(); }
  }, 400);
}

  let list = "";

  else if(teamState === "err") list = `<p class="note">Le suivi de l'équipe n'est pas joignable pour l'instant (pas de réseau, ou pas encore activé). Tes cases restent gardées sur ce téléphone.</p>`;
  else {
    list = team.length ? `<ul class="team">${team.map(t => {
      const c = t.coches || {}, done = CHECK.filter(x => c[x[0]]).length;
      const keys = KEY_ITEMS.map(k => { const it = CHECK.find(x => x[0] === k); return `<span class="pill ${c[k] ? "yes" : "no"}">${c[k] ? "✓" : "✗"} ${esc(it[1])}</span>`; }).join("");
      const miss = CHECK.filter(x => !c[x[0]] && !KEY_ITEMS.includes(x[0])).map(x => x[1]);

    }).join("")}</ul>` : `<p class="note">Personne encore. Entre ton prénom et coche tes cases : tu seras le premier.</p>`;
    if(teamState === "stale" || teamState === "err-save") list += `<p class="note">Pas de réseau : la liste peut ne pas être à jour. Ça se resynchronise tout seul.</p>`;
  }
  box.innerHTML = me + list;

function settle(list, cur){
  const bal = {}, paid = {}, share = {}, rbOut = {}, rbIn = {};
  PAYEURS.concat(MARIE).forEach(n => { bal[n] = 0; paid[n] = 0; share[n] = 0; rbOut[n] = 0; rbIn[n] = 0; });
  list.filter(d => d.c === cur).forEach(d => {
    const pour = (d.pour || []).filter(n => n !== MARIE); if(!pour.length) return;
    bal[d.p] = (bal[d.p] || 0) + d.m;
    if(d.rb){ rbOut[d.p] = (rbOut[d.p] || 0) + d.m; pour.forEach(n => rbIn[n] = (rbIn[n] || 0) + Math.round(d.m / pour.length)); }
    else paid[d.p] = (paid[d.p] || 0) + d.m;
    const part = Math.floor(d.m / pour.length); let reste = d.m - part * pour.length;
    pour.forEach(n => { const x = part + (reste > 0 ? 1 : 0); reste--; bal[n] = (bal[n] || 0) - x; if(!d.rb) share[n] = (share[n] || 0) + x;
      // part cochée « remboursé » sur cette dépense : elle est réglée, on la retire des comptes
      if(!d.rb && n !== d.p && d.ok && d.ok[n]){ bal[n] += x; bal[d.p] -= x; rbOut[n] = (rbOut[n] || 0) + x; rbIn[d.p] = (rbIn[d.p] || 0) + x; } });
  });
  const cred = [], debt = [];
  Object.keys(bal).forEach(n => { if(bal[n] > 0) cred.push([n, bal[n]]); else if(bal[n] < 0) debt.push([n, -bal[n]]); });
  cred.sort((a, b) => b[1] - a[1]); debt.sort((a, b) => b[1] - a[1]);
  const moves = []; let i = 0, j = 0;
  while(i < debt.length && j < cred.length){
    const x = Math.min(debt[i][1], cred[j][1]);
    if(x > 0) moves.push([debt[i][0], cred[j][0], x]);
    debt[i][1] -= x; cred[j][1] -= x;
    if(debt[i][1] === 0) i++; if(cred[j][1] === 0) j++;
  }
  return { bal, moves, paid, share, rbOut, rbIn };
}

// --- Date de prise de vue : une photo ou vidéo postée en retard est rangée au jour où elle a été prise ---
// Photo : EXIF DateTimeOriginal (+ OffsetTimeOriginal). Vidéo iPhone : com.apple.quicktime.creationdate, sinon mvhd.
const LATE_MIN = 20, MAX_MULTI = 10; // en dessous, on garde l'heure du post
async function takenAt(file){
  try{
    const ok = t => t && t < Date.now() + 5 * 60000 && t > Date.now() - 20 * 86400000 ? t : 0;
    if(/^image\//.test(file.type) || /\.jpe?g$/i.test(file.name || "")){
      const v = new DataView(await file.slice(0, 512 * 1024).arrayBuffer());
      if(v.getUint16(0) !== 0xFFD8) return 0;
      let o = 2;
      while(o + 4 < v.byteLength){
        const mk = v.getUint16(o), len = v.getUint16(o + 2);
        if(mk === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) return ok(readExif(v, o + 10));
        if((mk & 0xFF00) !== 0xFF00) return 0;
        o += 2 + len;
      }
      return 0;
    }
    if(/^video\//.test(file.type)){
      const buf = new Uint8Array(await file.arrayBuffer());
      let txt = ""; const step = 1 << 16;
      for(let i = 0; i < buf.length; i += step) txt += String.fromCharCode.apply(null, buf.subarray(i, i + step));
      const k = txt.indexOf("com.apple.quicktime.creationdate");
      if(k >= 0){
        const m = /(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:[+-]\d\d:?\d\d|Z))/.exec(txt.slice(k, k + 4000));
        if(m){ const t = Date.parse(m[1].replace(/([+-]\d\d)(\d\d)$/, "$1:$2")); if(ok(t)) return t; }
      }
      const h = txt.indexOf("mvhd");
      if(h >= 0){
        const dv = new DataView(buf.buffer, buf.byteOffset + h + 4);
        const secs = dv.getUint8(0) === 1 ? Number(dv.getBigUint64(4)) : dv.getUint32(4);
        return ok((secs - 2082844800) * 1000);
      }
    }
  }catch(e){}
  return 0;
}
function readExif(v, t0){
  const le = v.getUint16(t0) === 0x4949, u16 = o => v.getUint16(o, le), u32 = o => v.getUint32(o, le);
  const str = (o, n) => { let s = ""; for(let i = 0; i < n; i++){ const c = v.getUint8(o + i); if(!c) break; s += String.fromCharCode(c); } return s; };
  const tags = ifd => { const out = {}, n = u16(t0 + ifd); for(let i = 0; i < n; i++){ const e = t0 + ifd + 2 + i * 12, tag = u16(e), cnt = u32(e + 4);
    out[tag] = cnt > 4 ? str(t0 + u32(e + 8), cnt) : (tag === 0x8769 ? u32(e + 8) : str(e + 8, cnt)); } return out; };
  const ifd0 = tags(u32(t0 + 4)); let ex = {};
  if(ifd0[0x8769]) ex = tags(ifd0[0x8769]);
  const raw = ex[0x9003] || ex[0x9004] || ifd0[0x0132]; if(!raw) return 0;
  const m = /^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/.exec(raw); if(!m) return 0;
  const off = ex[0x9011] || ex[0x9012] || "";
  if(/^[+-]\d\d:\d\d$/.test(off)) return Date.parse(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}${off}`);
  return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime(); // heure du téléphone
}

function videoMeta(file){

    const url = URL.createObjectURL(file), v = document.createElement("video");
    let done = false; const fin = r => { if(done) return; done = true; ok(r); };
    v.muted = true; v.playsInline = true; v.setAttribute("playsinline", ""); v.preload = "auto"; v.src = url;

      : `<img id="stImg" class="${dir > 0 ? "in-r" : dir < 0 ? "in-l" : ""}" alt="Photo de ${esc(x.a || "")}" draggable="false">`}</div>

    ${x.t ? `<p class="st-cap">${esc(x.t)}</p>` : ""}
    <div class="st-foot">${reactBar(x.id)}<form class="cform st" data-cform="${esc(x.id)}"><input maxlength="200" placeholder="Envoyer un message…" enterkeyhint="send" autocomplete="off" aria-label="Commenter"><button type="submit" aria-label="Envoyer">➤</button></form></div></div>`;
  [story.list[story.i + 1], story.list[story.i + 2]].forEach(nx => { if(nx && nx.h && !imgCache[nx.id]) loadImg(nx.id, new Image()); });
  const vEl = document.getElementById("stVid");
  if(vEl){
    if(x.h && imgCache[x.id]) vEl.poster = imgCache[x.id];
    const go = () => vEl.play().catch(() => { if(!vEl.muted){ vEl.muted = true; storyMuted = true; const sb = document.getElementById("stSound"); if(sb) sb.textContent = "🔇"; vEl.play().catch(() => {}); } });
    vEl.onended = () => stepStory(1);
    vEl.onerror = () => { const cap = document.createElement("p"); cap.className = "st-cap"; cap.textContent = "Cette vidéo ne peut pas être lue sur ce téléphone."; vEl.replaceWith(cap); };
    go();
    document.getElementById("stSound").onclick = () => { storyMuted = !storyMuted; vEl.muted = storyMuted; document.getElementById("stSound").textContent = storyMuted ? "🔇" : "🔊"; if(vEl.paused) go(); };
  } else loadImg(x.id, document.getElementById("stImg"));
  document.getElementById("stClose").onclick = closeStory;
  // Gestes façon Snap / Insta : tap gauche/droite, glisser ← →, glisser vers le bas pour fermer, appui long = pause.
  const area = document.getElementById("stArea"), img = document.getElementById("stImg") || document.getElementById("stVid");
  let g = null;
  const resume = () => { if(!story || !story.paused) return; story.paused = false; story.t0 = Date.now(); if(vEl && vEl.paused && !vEl.ended) vEl.play().catch(() => {}); };
  area.onpointerdown = e => { if(!story) return; g = { x:e.clientX, y:e.clientY, t:Date.now() }; if(vEl) vEl.pause();
    story.paused = true; story.elapsed += Date.now() - story.t0; try{ area.setPointerCapture(e.pointerId); }catch(err){} };
  area.onpointermove = e => { if(!g) return; const dx = e.clientX - g.x, dy = e.clientY - g.y;
    img.style.transition = "none"; img.style.transform = Math.abs(dx) > Math.abs(dy) ? `translateX(${dx}px)` : dy > 0 ? `translateY(${dy}px) scale(${Math.max(.8, 1 - dy / 1200)})` : ""; };
  area.onpointerup = e => { if(!g || !story) return; const dx = e.clientX - g.x, dy = e.clientY - g.y, dt = Date.now() - g.t; g = null;
    img.style.transition = ""; img.style.transform = "";
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) return stepStory(dx < 0 ? 1 : -1);
    if(dy > 90 && dy > Math.abs(dx)) return closeStory();
    if(dt < 500 && Math.abs(dx) < 15 && Math.abs(dy) < 15){ const r = area.getBoundingClientRect(); return stepStory(e.clientX - r.left < r.width * .35 ? -1 : 1); }
    resume(); };
  area.onpointercancel = () => { g = null; img.style.transition = ""; img.style.transform = ""; resume(); };
  const bubs = document.createElement("div"); bubs.className = "st-coms"; bubs.id = "stComs"; bubs.innerHTML = storyBubbles(x.id); area.appendChild(bubs);
  const si = ov.querySelector(".cform.st input");
  si.onfocus = () => { if(!story || story.paused) return; story.paused = true; story.elapsed += Date.now() - story.t0; if(vEl) vEl.pause(); };
  si.onblur = () => resume();
  bindReacts(ov); bindComs(ov);
}
document.addEventListener("keydown", e => { if(!story) return; if(e.key === "Escape") closeStory(); else if(e.key === "ArrowRight") stepStory(1); else if(e.key === "ArrowLeft") stepStory(-1); });

function draw(){
  drawTabs();
  const v = document.getElementById("view");
  v.style.animation = "none"; void v.offsetWidth; v.style.animation = "";
  if(cur !== "today" && cur !== "logement" && !VIEWS[cur] && !DAYS.some(d => d.id === cur)) cur = "today";
  v.innerHTML = cur === "today" ? drawToday() : cur === "logement" ? drawLogement() : cur === "infos" ? drawInfos() : cur === "comptes" ? drawComptesView() : cur === "rank" ? drawRankView() : cur === "live" ? drawLiveView() : drawDay(DAYS.find(d => d.id === cur) || DAYS[0]);
  v.querySelectorAll("[data-tel]").forEach(b => b.onclick = () => {
    const ok = () => { b.textContent = "Numéro copié"; setTimeout(() => b.textContent = "Copier le numéro", 1800); };
    try{ navigator.clipboard.writeText(b.dataset.tel).then(ok, () => { getSelection().selectAllChildren(b.parentNode.parentNode.querySelector(".tel")); b.textContent = "Sélectionné"; }); }
    catch(e){ getSelection().selectAllChildren(b.parentNode.parentNode.querySelector(".tel")); }
  });
  v.querySelectorAll("[data-c]").forEach(c => c.onchange = () => { if(c.checked) checked[c.dataset.c] = true; else delete checked[c.dataset.c]; save(); pushMe(); });
  if(cur === "infos"){ drawTeam(); loadTeam(); }
  if(cur === "comptes"){ drawComptes(); loadTeam(); }
  if(cur === "live"){ tickClocks(); drawLive(); loadLive(); }
  if(cur === "rank"){ drawRank(); loadRank(); }
  if(cur === "today"){ drawTodayBits(); loadLive(); loadTeam(); }
  v.querySelectorAll("[data-go]").forEach(b => b.onclick = () => show(b.dataset.go));
  const ch = document.getElementById("copyHome"); if(ch) ch.onclick = copyHome;
}
function copyHome(e){
  const b = e.currentTarget;
  const done = () => { b.textContent = "Adresse copiée"; setTimeout(() => b.textContent = "Copier l'adresse", 1800); };
  try{ navigator.clipboard.writeText(HOME).then(done, () => { getSelection().selectAllChildren(document.getElementById("homeAddr")); b.textContent = "Sélectionnée, copie-la"; }); }
  catch(err){ getSelection().selectAllChildren(document.getElementById("homeAddr")); }
}
